    body {

      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .font-sports {
      font-family: 'Teko', sans-serif;
      letter-spacing: 0.05em;
    }

    /* Hide scrollbars for clean horizontal sliding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Active pick styling */
    .team-btn {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .team-btn:active:not(.disabled) {
      transform: scale(0.98);
    }
    .team-btn.winner {
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.28) 0%, rgba(30, 41, 59, 0.95) 100%);

      color: #93c5fd;
      font-weight: 700;
    }
    .team-btn.eliminated {
      opacity: 0.45;
      text-decoration: line-through;
    }

    /* Toast animation */
    #toast {
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* Print styling */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-page {
        page-break-after: always;
        break-after: page;
        padding: 20px;
        background: white !important;
        color: black !important;

    window.addEventListener('DOMContentLoaded', () => {

      renderApp();
      updateProgress();
    });

    function savePicks() {
      try {
        localStorage.setItem('fbs_138_picks_mobile', JSON.stringify(PICKS));
      } catch (e) {
        console.warn('LocalStorage save failed', e);
      }
    }

    function loadPicks() {
      try {
        const saved = localStorage.getItem('fbs_138_picks_mobile');
        if (saved) {
          Object.assign(PICKS, JSON.parse(saved));
        }
      } catch (e) {
        console.warn('LocalStorage load failed', e);
      }
    }

    /* ============================================================
       3. BRACKET PICK ENGINE & DYNAMIC PROPAGATION
       ============================================================ */
    function selectWinner(gameId, winningTeam) {
      if (!winningTeam || !winningTeam.name) return;

      const previousWinner = PICKS[gameId];
      if (previousWinner && previousWinner.name === winningTeam.name) {
        return; // Already selected
      }

      // If winner changed, purge downstream games that used old winner
      if (previousWinner) {
        purgeDownstream(gameId, previousWinner.name);
      }

      PICKS[gameId] = {
        name: winningTeam.name,
        seed: winningTeam.seed
      };

      savePicks();
      renderApp();
      updateProgress();
    }

    function purgeDownstream(triggerGameId, oldTeamName) {
      for (const [id, pick] of Object.entries(PICKS)) {
        if (id !== triggerGameId && pick.name === oldTeamName) {
          delete PICKS[id];
          // Recursively clean
          purgeDownstream(id, oldTeamName);
        }
      }
    }

    function getWinner(gameId) {
      return PICKS[gameId] || null;
    }

        CURRENT_ROUND = 'r128';
      }

      // Update bottom nav bar styles
      document.querySelectorAll('.nav-tab').forEach(tab => {
        if (tab.dataset.region === regionKey) {
          tab.classList.add('text-blue-400', 'bg-slate-800/80');
          tab.classList.remove('text-slate-400');
        } else {
          tab.classList.remove('text-blue-400', 'bg-slate-800/80');
          tab.classList.add('text-slate-400');
        }
      });

      renderApp();
    }

    function switchRound(roundKey) {
      CURRENT_ROUND = roundKey;
      renderApp();
    }

    function advanceToNextRoundTab() {
      const idx = REGION_ROUNDS.findIndex(r => r.key === CURRENT_ROUND);
      if (idx !== -1 && idx < REGION_ROUNDS.length - 1) {
        switchRound(REGION_ROUNDS[idx + 1].key);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (idx === REGION_ROUNDS.length - 1) {
        switchRegion('finals');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    /* ============================================================
       5. COMPONENT BUILDERS (CARDS, MATCHUPS, ROUNDS)
       ============================================================ */
    function renderMatchupCard(gameId, teamA, teamB, label, subtitle) {
      const winner = getWinner(gameId);

      const isA = winner && teamA && winner.name === teamA.name;
      const isB = winner && teamB && winner.name === teamB.name;
      const isAElim = winner && teamA && winner.name !== teamA.name;
      const isBElim = winner && teamB && winner.name !== teamB.name;

      const hasA = teamA && teamA.name;
      const hasB = teamB && teamB.name;

      return `
        <div class="bg-slate-900 border ${winner ? 'border-blue-900/50' : 'border-slate-800'} rounded-2xl overflow-hidden shadow-sm transition">
          <div class="bg-slate-950/70 px-3 py-1.5 border-b border-slate-800/70 flex items-center justify-between text-[11px] text-slate-400">
            <span class="font-bold text-slate-300 font-mono tracking-tight">${label}</span>
            <div class="flex items-center gap-1.5">
              ${subtitle ? `<span class="text-slate-500 text-[10px]">${subtitle}</span>` : ''}
              ${winner ? '<span class="text-blue-400 font-bold flex items-center gap-1"><i class="ph-bold ph-check"></i> Selected</span>' : '<span class="text-amber-400/80 font-medium">Tap to Pick</span>'}
            </div>
          </div>

          <div class="p-2 space-y-1.5">
            <!-- Team A Button -->
            <button type="button"
                    onclick="${hasA ? `selectWinner('${gameId}', {name: '${escapeQuotes(teamA.name)}', seed: '${teamA.seed || ''}'})` : ''}"
                    class="team-btn w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-800/80 bg-slate-950/40 text-left text-xs ${isA ? 'winner' : ''} ${isAElim ? 'eliminated' : ''} ${!hasA ? 'disabled text-slate-600 italic cursor-not-allowed' : 'text-slate-100 hover:border-slate-700'}">
              <div class="flex items-center gap-2 truncate pr-2">
                ${teamA && teamA.seed ? `<span class="w-6 h-5 flex items-center justify-center text-[10px] font-mono font-black bg-slate-800 text-blue-400 rounded-md shrink-0">#${teamA.seed}</span>` : ''}
                <span class="font-semibold truncate text-[13px]">${hasA ? teamA.name : 'Waiting for Previous Round'}</span>
              </div>
              <div class="shrink-0 pl-1">
                ${isA ? '<i class="ph-fill ph-check-circle text-blue-400 text-lg"></i>' : '<div class="w-4 h-4 rounded-full border border-slate-700"></div>'}
              </div>
            </button>

            <!-- Team B Button -->
            <button type="button"
                    onclick="${hasB ? `selectWinner('${gameId}', {name: '${escapeQuotes(teamB.name)}', seed: '${teamB.seed || ''}'})` : ''}"
                    class="team-btn w-full flex items-center justify-between p-2.5 rounded-xl border border-slate-800/80 bg-slate-950/40 text-left text-xs ${isB ? 'winner' : ''} ${isBElim ? 'eliminated' : ''} ${!hasB ? 'disabled text-slate-600 italic cursor-not-allowed' : 'text-slate-100 hover:border-slate-700'}">
              <div class="flex items-center gap-2 truncate pr-2">
                ${teamB && teamB.seed ? `<span class="w-6 h-5 flex items-center justify-center text-[10px] font-mono font-black bg-slate-800 text-blue-400 rounded-md shrink-0">#${teamB.seed}</span>` : ''}
                <span class="font-semibold truncate text-[13px]">${hasB ? teamB.name : 'Waiting for Previous Round'}</span>
              </div>
              <div class="shrink-0 pl-1">
                ${isB ? '<i class="ph-fill ph-check-circle text-blue-400 text-lg"></i>' : '<div class="w-4 h-4 rounded-full border border-slate-700"></div>'}
              </div>
            </button>
          </div>
        </div>
      `;
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'");
    }

    /* ============================================================
       6. MASTER RENDER ROUTER
       ============================================================ */

      // 1. If in Finals
      if (CURRENT_REGION === 'finals') {

    function renderCurrentRoundMatchups() {
      const container = document.getElementById('matchupListContainer');
      if (!container) return;

      const reg = TOURNAMENT_DATA[CURRENT_REGION];
      const rKeyUpper = CURRENT_REGION.toUpperCase();

      // Compute Round of 128 matchups with play-in winners
      const r128 = reg.round128.map(m => {
        let teamBName = m.team2;
        if (m.playInTarget) {
          const piWin = getWinner(m.playInTarget);
          teamBName = piWin ? piWin.name : `Winner of ${m.playInTarget}`;
        }
        return {
          id: m.id,
          teamA: { name: m.team1, seed: m.seed1 },
          teamB: { name: teamBName, seed: m.seed2 }
        };
      });

      // Round 2 (Round of 64) -> 8 games
      const r64 = [];
      for (let i = 0; i < 8; i++) {
        const id = `${rKeyUpper}_R64_${i+1}`;
        const tA = getWinner(r128[i * 2].id);
        const tB = getWinner(r128[i * 2 + 1].id);
        r64.push({ id, teamA: tA, teamB: tB, label: `Round of 64 - Match ${i+1}` });
      }

      // Round 3 (Sweet 16) -> 4 games
      const s16 = [];
      for (let i = 0; i < 4; i++) {
        const id = `${rKeyUpper}_S16_${i+1}`;
        const tA = getWinner(r64[i * 2].id);
        const tB = getWinner(r64[i * 2 + 1].id);
        s16.push({ id, teamA: tA, teamB: tB, label: `Sweet 16 - Match ${i+1}` });
      }

      // Round 4 (Elite 8) -> 2 games
      const e8 = [];
      for (let i = 0; i < 2; i++) {
        const id = `${rKeyUpper}_E8_${i+1}`;
        const tA = getWinner(s16[i * 2].id);
        const tB = getWinner(s16[i * 2 + 1].id);
        e8.push({ id, teamA: tA, teamB: tB, label: `Regional Semifinal ${i+1}` });
      }

      // Round 5 (Regional Championship)
      const regChampId = `${rKeyUpper}_CHAMP`;
      const regTeamA = getWinner(e8[0].id);
      const regTeamB = getWinner(e8[1].id);

      // Render based on CURRENT_ROUND tab
      if (CURRENT_ROUND === 'playin') {
        container.innerHTML = `
          <div class="p-3 bg-blue-950/20 border border-blue-900/40 rounded-xl mb-3 text-xs text-blue-300">
            <strong>First Four Play-Ins:</strong> Winners immediately secure their Round of 128 tournament spots below.
          </div>
          <div class="space-y-3">
            ${reg.playIns.map((pi, idx) => renderMatchupCard(pi.id, pi.teamA, pi.teamB, pi.name, 'First Four Slot')).join('')}
          </div>
        `;
      } else if (CURRENT_ROUND === 'r128') {
        container.innerHTML = r128.map((m, idx) => renderMatchupCard(m.id, m.teamA, m.teamB, `R128 Game ${idx+1}`, 'Campus Site')).join('');
      } else if (CURRENT_ROUND === 'r64') {
        container.innerHTML = r64.map(m => renderMatchupCard(m.id, m.teamA, m.teamB, m.label, 'Round of 64')).join('');
      } else if (CURRENT_ROUND === 's16') {
        container.innerHTML = s16.map(m => renderMatchupCard(m.id, m.teamA, m.teamB, m.label, 'Sweet 16')).join('');
      } else if (CURRENT_ROUND === 'e8') {
        container.innerHTML = e8.map(m => renderMatchupCard(m.id, m.teamA, m.teamB, m.label, 'Regional Semis')).join('');
      } else if (CURRENT_ROUND === 'champ') {
        const regWinner = getWinner(regChampId);
        container.innerHTML = `
          <div class="bg-gradient-to-b from-blue-950/30 to-slate-900 border border-blue-900/50 p-4 rounded-2xl shadow-xl space-y-3">
            <div class="text-center">
              <span class="text-[10px] font-black uppercase tracking-widest text-blue-400 bg-blue-900/40 px-2 py-0.5 rounded-full border border-blue-800">
                ${reg.name} Championship
              </span>
              <h3 class="text-lg font-black uppercase text-white mt-1">Regional Final</h3>
              <p class="text-xs text-slate-400">Winner punches ticket to the College Football Final Four</p>
            </div>

            ${renderMatchupCard(regChampId, regTeamA, regTeamB, `${reg.name} Crown`, 'Final Four Berth')}

            <div class="p-3 bg-slate-950/80 border border-slate-800 rounded-xl text-center">
              <span class="text-[10px] text-slate-400 block uppercase font-bold">Regional Champion</span>
              <span class="text-base font-black text-amber-400 uppercase tracking-wide block mt-0.5">
                ${regWinner ? regWinner.name : 'Awaiting Selection'}
              </span>
            </div>
          </div>
        `;
      }
    }

    /* ============================================================
       8. PROGRESS & STATS
       ============================================================ */
    function updateProgress() {
      const totalMatches = 137;
      const count = Object.keys(PICKS).length;
      const pct = Math.min(100, Math.round((count / totalMatches) * 100));

      const bar = document.getElementById('progressBar');
      const txt = document.getElementById('progressText');
      const headerChamp = document.getElementById('quickChampHeader');

      if (bar) bar.style.width = `${pct}%`;
      if (txt) txt.textContent = `${count} / ${totalMatches} Picked`;

      const champ = getWinner('NAT_CHAMPIONSHIP');
      if (headerChamp) {
        if (champ) {
          headerChamp.textContent = `Champ: ${champ.name}`;
          headerChamp.className = 'text-amber-400 font-bold truncate max-w-[140px] sm:max-w-[200px]';
        } else {
          headerChamp.textContent = 'Champ: Undecided';
          headerChamp.className = 'text-slate-400 font-semibold truncate max-w-[140px] sm:max-w-[200px]';
        }
      }
    }

    /* ============================================================
       9. RANDOMIZE / AUTO-PICK & RESET
       ============================================================ */
    function randomizeAllPicks() {
      // 1. Play-ins
      ['east', 'south', 'midwest', 'west'].forEach(rKey => {
        const reg = TOURNAMENT_DATA[rKey];
        reg.playIns.forEach(pi => {
          selectWinner(pi.id, Math.random() < 0.5 ? pi.teamA : pi.teamB);
        });
      });

      // 2. Quadrants round-by-round
      ['east', 'south', 'midwest', 'west'].forEach(rKey => {
        const reg = TOURNAMENT_DATA[rKey];
        const rUpper = rKey.toUpperCase();

        // R128
        reg.round128.forEach(m => {
          let teamBName = m.team2;
          if (m.playInTarget) {
            teamBName = (getWinner(m.playInTarget) || { name: m.team2 }).name;
          }
          // Seed weighted odds
          const seedWeight = m.seed1 < m.seed2 ? 0.72 : 0.5;
          selectWinner(m.id, Math.random() < seedWeight ? { name: m.team1, seed: m.seed1 } : { name: teamBName, seed: m.seed2 });
        });

        // R64
        for (let i = 0; i < 8; i++) {
          const gId = `${rUpper}_R64_${i+1}`;
          const tA = getWinner(reg.round128[i*2].id);
          const tB = getWinner(reg.round128[i*2+1].id);
          if (tA && tB) selectWinner(gId, Math.random() < 0.5 ? tA : tB);
        }

        // Sweet 16
        for (let i = 0; i < 4; i++) {
          const gId = `${rUpper}_S16_${i+1}`;
          const tA = getWinner(`${rUpper}_R64_${i*2+1}`);
          const tB = getWinner(`${rUpper}_R64_${i*2+2}`);
          if (tA && tB) selectWinner(gId, Math.random() < 0.5 ? tA : tB);
        }

        // Elite 8
        for (let i = 0; i < 2; i++) {
          const gId = `${rUpper}_E8_${i+1}`;
          const tA = getWinner(`${rUpper}_S16_${i*2+1}`);
          const tB = getWinner(`${rUpper}_S16_${i*2+2}`);
          if (tA && tB) selectWinner(gId, Math.random() < 0.5 ? tA : tB);
        }

        // Regional Final
        const regChampId = `${rUpper}_CHAMP`;
        const rA = getWinner(`${rUpper}_E8_1`);
        const rB = getWinner(`${rUpper}_E8_2`);
        if (rA && rB) selectWinner(regChampId, Math.random() < 0.5 ? rA : rB);
      });

      // 3. National Semis & Final
      const eChamp = getWinner('EAST_CHAMP');
      const mChamp = getWinner('MIDWEST_CHAMP');
      if (eChamp && mChamp) {
        selectWinner('NAT_SEMI_1', Math.random() < 0.5 ? eChamp : mChamp);
      }

      const sChamp = getWinner('SOUTH_CHAMP');
      const wChamp = getWinner('WEST_CHAMP');
      if (sChamp && wChamp) {
        selectWinner('NAT_SEMI_2', Math.random() < 0.5 ? sChamp : wChamp);
      }

      const f1 = getWinner('NAT_SEMI_1');
      const f2 = getWinner('NAT_SEMI_2');
      if (f1 && f2) {
        selectWinner('NAT_CHAMPIONSHIP', Math.random() < 0.5 ? f1 : f2);
      }

      showToast('All 137 games randomly simulated!', 'ph-shuffle');
    }

    function confirmResetPicks() {
      for (const k of Object.keys(PICKS)) {
        delete PICKS[k];
      }
      savePicks();
      renderApp();
      updateProgress();
      showToast('Bracket reset. Start fresh!', 'ph-trash');
    }

    /* ============================================================
       10. SHARING VIA WEB SHARE API & CLIPBOARD
       ============================================================ */
    async function shareBracket() {
      const champ = getWinner('NAT_CHAMPIONSHIP');
      const champText = champ ? champ.name : 'Undecided';
      const shareData = {
        title: 'NCAA FBS 138-Team Mega-Bracket',
        text: `Check out my 138-Team College Football National Bracket! My predicted National Champion: ${champText}.`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
          showToast('Shared successfully!', 'ph-share-network');
        } catch (e) {
          // User cancelled or share failed
        }
      } else {
        // Fallback copy summary to clipboard
        try {
          document.execCommand('copy');
          showToast('Bracket summary copied to clipboard!', 'ph-copy');
        } catch (err) {
          showToast('Share link ready!', 'ph-share-network');
        }
      }
    }

    function showToast(msg, iconName = 'ph-info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      if (toast && toastMsg) {
        toastMsg.textContent = msg;
        if (toastIcon) toastIcon.className = `ph-bold ${iconName} text-blue-400 text-base`;
        toast.classList.remove('opacity-0', 'translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-3');
          toast.classList.remove('opacity-100', 'translate-y-0');
        }, 2200);
      }
    }

      function buildRegionTable(rKey, title) {

        return `
          <div class="print-page" style="page-break-after: always; padding: 20px; font-family: sans-serif; color: #111;">
            <div style="border-bottom: 2px solid #0f172a; padding-bottom: 6px; margin-bottom: 10px; display: flex; justify-content: space-between;">
              <h2 style="font-size: 16px; margin: 0; text-transform: uppercase;">${title} Picks</h2>
              <span style="font-size: 11px; font-weight: 700; color: #2563eb;">Regional Winner: ${(getWinner(`${rKey.toUpperCase()}_CHAMP`) || {name: 'UNDECIDED'}).name}</span>
            </div>

            <table style="width: 100%; border-collapse: collapse; font-size: 9.5px;">
              <thead>
                <tr style="background: #0f172a; color: white;">
                  <th style="padding: 4px; text-align: left;">Round of 128 Matchup</th>
                  <th style="padding: 4px; text-align: left;">R128 Pick</th>
                  <th style="padding: 4px; text-align: left;">R64 Pick</th>
                  <th style="padding: 4px; text-align: left;">Sweet 16</th>
                  <th style="padding: 4px; text-align: left;">Elite 8</th>
                </tr>
              </thead>
              <tbody>
                ${reg.round128.map((m, i) => {
                  const r128Win = getWinner(m.id);
                  const r64Win = getWinner(`${rKey.toUpperCase()}_R64_${Math.floor(i/2)+1}`);
                  const s16Win = getWinner(`${rKey.toUpperCase()}_S16_${Math.floor(i/4)+1}`);
                  const e8Win = getWinner(`${rKey.toUpperCase()}_E8_${Math.floor(i/8)+1}`);

                  return `
                    <tr style="border-bottom: 1px solid #e2e8f0; ${i % 2 === 1 ? 'background: #f8fafc;' : ''}">
                      <td style="padding: 3.5px;">(#${m.seed1}) ${m.team1} vs (#${m.seed2}) ${m.team2}</td>
                      <td style="padding: 3.5px; font-weight: 600; color: #2563eb;">${r128Win ? r128Win.name : '—'}</td>
                      <td style="padding: 3.5px; font-weight: 600;">${i % 2 === 0 && r64Win ? r64Win.name : ''}</td>
                      <td style="padding: 3.5px; font-weight: 600; color: #b45309;">${i % 4 === 0 && s16Win ? s16Win.name : ''}</td>
                      <td style="padding: 3.5px; font-weight: 700; color: #15803d;">${i % 8 === 0 && e8Win ? e8Win.name : ''}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      exportContainer.innerHTML = `
        <!-- Cover & Championship Certificate -->
        <div class="print-page" style="page-break-after: always; padding: 25px; font-family: sans-serif; color: #111;">
          <div style="text-align: center; border-bottom: 2px solid #0f172a; padding-bottom: 12px; margin-bottom: 16px;">
            <h1 style="font-size: 22px; font-weight: 900; margin: 0; text-transform: uppercase;">
              NCAA Division I FBS 138-Team National Bracket
            </h1>
            <p style="font-size: 12px; color: #475569; margin: 4px 0 0 0;">Official User Selections • All 138 Programs Included</p>
          </div>

          <div style="background: #f1f5f9; border: 2px solid #0f172a; border-radius: 8px; padding: 18px; text-align: center; margin-bottom: 20px;">
            <span style="font-size: 11px; font-weight: 800; text-transform: uppercase; color: #475569; letter-spacing: 0.1em; display: block;">
              Predicted Consensus National Champion
            </span>
            <div style="font-size: 26px; font-weight: 900; color: #1d4ed8; text-transform: uppercase; margin-top: 6px;">
              ${natChamp ? natChamp.name : 'NO CHAMPION SELECTED YET'}
            </div>
          </div>

          <h3 style="font-size: 13px; font-weight: 800; text-transform: uppercase; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; margin-bottom: 10px;">
            The Final Four Qualifiers
          </h3>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; background: #fafafa;">
              <span style="font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase;">East Champion</span>
              <div style="font-size: 13px; font-weight: 700;">${eastChamp ? eastChamp.name : '—'}</div>
            </div>
            <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; background: #fafafa;">
              <span style="font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase;">Midwest Champion</span>
              <div style="font-size: 13px; font-weight: 700;">${midwestChamp ? midwestChamp.name : '—'}</div>
            </div>
            <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; background: #fafafa;">
              <span style="font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase;">South Champion</span>
              <div style="font-size: 13px; font-weight: 700;">${southChamp ? southChamp.name : '—'}</div>
            </div>
            <div style="border: 1px solid #cbd5e1; padding: 8px; border-radius: 4px; background: #fafafa;">
              <span style="font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase;">West Champion</span>
              <div style="font-size: 13px; font-weight: 700;">${westChamp ? westChamp.name : '—'}</div>
            </div>
          </div>

          <div style="border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; font-size: 9.5px; color: #475569; line-height: 1.4;">
            <strong>Tournament Summary:</strong> Covers all 138 NCAA Football Bowl Subdivision (FBS) teams across 137 tournament matchups, beginning with 10 First Four play-ins and cascading through the 128-team Round of 64 into the neutral-site National Finals.
          </div>
        </div>

        <!-- Regional breakdown pages -->
        ${buildRegionTable('east', 'East Quadrant')}
        ${buildRegionTable('south', 'South Quadrant')}
        ${buildRegionTable('midwest', 'Midwest Quadrant')}
        ${buildRegionTable('west', 'West Quadrant')}
      `;

      const opt = {
        margin: 0.25,
        filename: 'FBS_138_Championship_Bracket.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'landscape' }
      };

      html2pdf().set(opt).from(exportContainer).save().then(() => {
        exportContainer.classList.add('hidden');
        btn.innerHTML = origHtml;
        btn.disabled = false;
        showToast('PDF downloaded successfully!', 'ph-file-pdf');
      }).catch(err => {
        console.error('PDF error:', err);
        window.print();
        exportContainer.classList.add('hidden');
        btn.innerHTML = origHtml;
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
