<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FBS 138-Team College Football National Bracket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { bg: '#090d16', card: '#111827', cardLight: '#1f293d', border: '#2b3952', accent: '#3b82f6', gold: '#f59e0b', crimson: '#ef4444' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-team { transition: background 0.15s ease, border-color 0.15s ease; }
    .card-team:active { transform: scale(0.98); }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans select-none pb-24">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-40 px-4 py-3 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="ph ph-trophy text-amber-400 text-2xl"></i>
        <div>
          <h1 class="font-extrabold text-base tracking-wide uppercase text-white leading-tight">FBS 138 Championship</h1>
          <p class="text-xs text-gray-400 font-medium">All 138 Programs &bull; Click to Pick</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="openSeedingModal()" class="px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-blue-400 border border-blue-500/30 rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-sm">
          <i class="ph ph-shuffle"></i>
          <span>Seed/Shuffle</span>
        </button>
        <button onclick="downloadBracketPDF()" id="pdfBtn" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold flex items-center space-x-1 shadow-md">
          <i class="ph ph-file-pdf"></i>
          <span>PDF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Progress Bar & Quick Controls -->
  <div class="bg-gray-950/80 border-b border-gray-800/80 px-4 py-2 sticky top-[57px] z-30 backdrop-blur-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-3 text-xs">
      <div class="flex-1 flex items-center space-x-2">
        <div class="w-full bg-gray-800 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-gradient-to-r from-blue-500 to-amber-400 h-2 w-0 transition-all duration-300"></div>
        </div>
        <span id="progressText" class="text-gray-400 whitespace-nowrap text-[11px] font-mono">0/137</span>
      </div>
      <div class="flex space-x-1.5">
        <button onclick="randomizeAllPicks()" class="px-2 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-[11px] font-medium">Auto-Pick</button>
        <button onclick="resetBracket()" class="px-2 py-1 bg-gray-800 hover:bg-rose-900/40 text-gray-400 hover:text-rose-300 rounded text-[11px] font-medium">Clear</button>
      </div>
    </div>
  </div>

  <!-- Round Filter Carousel -->
  <div id="roundFilterNav" class="bg-gray-900/60 border-b border-gray-800/60 px-4 py-2 sticky top-[97px] z-20 backdrop-blur-sm">
    <div id="roundFilterContainer" class="max-w-4xl mx-auto flex space-x-2 overflow-x-auto no-scrollbar py-0.5 text-xs font-medium text-gray-400">
      <!-- Injected dynamically -->
    </div>
  </div>

  <!-- Main Bracket Workspace -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4" id="mainContainer">
    <!-- Active Quadrant or Finals Screen will render here -->
    <div id="activeScreenContainer" class="space-y-4"></div>
  </main>

  <!-- Sticky Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-40 px-2 py-1.5 shadow-2xl">
    <div class="max-w-md mx-auto grid grid-cols-5 text-center text-[10px] font-semibold text-gray-400">
      <button onclick="switchQuadrant('east')" id="nav-east" class="py-1 flex flex-col items-center space-y-0.5">
        <i class="ph ph-compass text-lg"></i>
        <span>East (34)</span>
      </button>
      <button onclick="switchQuadrant('south')" id="nav-south" class="py-1 flex flex-col items-center space-y-0.5">
        <i class="ph ph-sun text-lg"></i>
        <span>South (34)</span>
      </button>
      <button onclick="switchQuadrant('midwest')" id="nav-midwest" class="py-1 flex flex-col items-center space-y-0.5">
        <i class="ph ph-wind text-lg"></i>
        <span>Midwest (35)</span>
      </button>
      <button onclick="switchQuadrant('west')" id="nav-west" class="py-1 flex flex-col items-center space-y-0.5">
        <i class="ph ph-mountains text-lg"></i>
        <span>West (35)</span>
      </button>
      <button onclick="switchQuadrant('finals')" id="nav-finals" class="py-1 flex flex-col items-center space-y-0.5 text-amber-400">
        <i class="ph ph-crown text-lg"></i>
        <span>Finals</span>
      </button>
    </div>
  </nav>

  <!-- Seeding & Shuffle Modal -->
  <div id="seedModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-3 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl max-w-lg w-full max-h-[88vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-gray-800 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <i class="ph ph-faders text-blue-400 text-xl"></i>
          <h2 class="font-bold text-white text-sm uppercase tracking-wider">Quadrant Seeding Engine</h2>
        </div>
        <button onclick="closeSeedingModal()" class="text-gray-400 hover:text-white p-1">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <div class="p-3 bg-gray-950/70 border-b border-gray-800 flex items-center justify-between gap-2">
        <span class="text-xs text-gray-400">Active Quadrant: <strong id="modalRegionTitle" class="text-white capitalize">East</strong></span>
        <div class="flex space-x-2">
          <button onclick="shuffleCurrentQuadrant()" class="px-2.5 py-1 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded text-xs font-semibold flex items-center space-x-1">
            <i class="ph ph-arrows-clockwise"></i>
            <span>Shuffle This Region</span>
          </button>
          <button onclick="shuffleAllQuadrants()" class="px-2.5 py-1 bg-blue-600/30 hover:bg-blue-600/40 text-blue-300 border border-blue-500/40 rounded text-xs font-semibold flex items-center space-x-1">
            <i class="ph ph-shuffle"></i>
            <span>Shuffle All 138</span>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar" id="modalTeamsList">
        <!-- Rendered dynamically -->
      </div>

      <div class="p-3 border-t border-gray-800 bg-gray-950 flex justify-end space-x-2">
        <button onclick="closeSeedingModal()" class="px-4 py-1.5 bg-gray-800 text-gray-300 rounded-lg text-xs font-semibold">Done</button>
      </div>
    </div>
  </div>

  <!-- Hidden PDF Printable Container -->
  <div id="pdfExportContainer" class="hidden"></div>

  <script>
    // Master FBS 138 Team Database by Quadrant
    const DEFAULT_TEAMS = {
      east: [
        "Penn State", "Georgia", "Miami (FL)", "Clemson", "Indiana", "Army", "SMU", "Pittsburgh", 
        "Syracuse", "Louisville", "Duke", "Virginia", "North Carolina", "Boston College", "Wake Forest", 
        "Virginia Tech", "NC State", "West Virginia", "Navy", "East Carolina", "South Florida", "Temple", 
        "Charlotte", "FAU", "FIU", "Liberty", "James Madison", "Old Dominion", "Appalachian State", 
        "Marshall", "Coastal Carolina", "Georgia Southern", "Georgia State", "Kennesaw State"
      ],
      south: [
        "Texas", "Tennessee", "Alabama", "Ole Miss", "Texas A&M", "LSU", "Missouri", "South Carolina", 
        "Vanderbilt", "Florida", "Arkansas", "Auburn", "Kentucky", "Mississippi State", "Tulane", 
        "Memphis", "UTSA", "North Texas", "Rice", "Tulsa", "UAB", "Louisiana", "Troy", "Texas State", 
        "South Alabama", "Southern Miss", "ULM", "Arkansas State", "Jacksonville State", "Western Kentucky", 
        "Middle Tennessee", "Sam Houston", "UTEP", "Louisiana Tech"
      ],
      midwest: [
        "Ohio State", "Notre Dame", "Iowa State", "BYU", "Kansas State", "Illinois", "Michigan", 
        "Wisconsin", "Minnesota", "Iowa", "Nebraska", "Michigan State", "Rutgers", "Maryland", "Purdue", 
        "Northwestern", "Cincinnati", "Kansas", "Toledo", "Bowling Green", "Western Michigan", "Miami (OH)", 
        "Ohio", "Buffalo", "Northern Illinois", "Eastern Michigan", "Central Michigan", "Ball State", 
        "Akron", "Kent State", "UMass", "UConn", "Missouri State", "Delaware", "Indiana State"
      ],
      west: [
        "Oregon", "Boise State", "Colorado", "Arizona State", "Washington State", "UNLV", "Utah", 
        "USC", "Washington", "Arizona", "TCU", "Baylor", "Texas Tech", "Houston", "Oklahoma State", 
        "UCF", "Colorado State", "San Jose State", "Fresno State", "Hawaii", "Nevada", "Wyoming", 
        "Utah State", "New Mexico", "Air Force", "San Diego State", "Oregon State", "Stanford", 
        "California", "New Mexico State", "UTSA State", "Idaho State", "Montana State", "Sacramento State", "Weber State"
      ]
    };

    // State
    let currentQuadrant = 'east';
    let activeRound = 'playin';
    let teamData = JSON.parse(localStorage.getItem('fbs_custom_teams')) || JSON.parse(JSON.stringify(DEFAULT_TEAMS));
    let bracketPicks = JSON.parse(localStorage.getItem('fbs_bracket_picks')) || {};

    const QUADRANTS = ['east', 'south', 'midwest', 'west'];

    function saveState() {
      localStorage.setItem('fbs_custom_teams', JSON.stringify(teamData));
      localStorage.setItem('fbs_bracket_picks', JSON.stringify(bracketPicks));
      updateProgress();
    }

    function init() {
      switchQuadrant(currentQuadrant);
      updateProgress();
    }

    function switchQuadrant(quad) {
      currentQuadrant = quad;
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-blue-400', 'text-amber-400');
        b.classList.add('text-gray-400');
      });
      const activeNav = document.getElementById(`nav-${quad}`);
      if (activeNav) {
        activeNav.classList.remove('text-gray-400');
        activeNav.classList.add(quad === 'finals' ? 'text-amber-400' : 'text-blue-400');
      }

      renderRoundFilters();
      renderScreen();
    }

    function renderRoundFilters() {
      const container = document.getElementById('roundFilterContainer');
      const navBar = document.getElementById('roundFilterNav');
      if (currentQuadrant === 'finals') {
        navBar.classList.add('hidden');
        return;
      }
      navBar.classList.remove('hidden');

      const rounds = [
        { id: 'playin', label: 'Play-In' },
        { id: 'r128', label: 'Round of 128' },
        { id: 'r64', label: 'Round of 64' },
        { id: 'sweet16', label: 'Sweet 16' },
        { id: 'elite8', label: 'Elite 8' },
        { id: 'regionfinal', label: 'Region Final' }
      ];

      container.innerHTML = rounds.map(r => `
        <button onclick="setRound('${r.id}')" class="px-3 py-1 rounded-full whitespace-nowrap transition-colors ${activeRound === r.id ? 'bg-blue-600 text-white font-semibold' : 'bg-gray-800 text-gray-300 hover:bg-gray-700'}">
          ${r.label}
        </button>
      `).join('');
    }

    function setRound(r) {
      activeRound = r;
      renderRoundFilters();
      renderScreen();
    }

    // Quadrant Bracket Builders
    function getQuadrantMatchups(quad) {
      const teams = teamData[quad];
      const count = teams.length;
      const playInCount = count - 32; // e.g. 34 - 32 = 2 play-in games

      // Play-ins
      let playIns = [];
      for (let i = 0; i < playInCount; i++) {
        const seedA = 32 - playInCount + i + 1;
        const seedB = seedA + playInCount;
        playIns.push({
          id: `${quad}_pi_${i}`,
          round: 'playin',
          teamA: teams[seedA - 1] || `Team ${seedA}`,
          seedA: seedA,
          teamB: teams[seedB - 1] || `Team ${seedB}`,
          seedB: seedB,
          nextMatchId: `${quad}_r128_${31 - playInCount + i}`
        });
      }

      // Round of 128 (32 teams -> 16 matches per quadrant)
      let r128 = [];
      const pairings = [
        [1, 32], [16, 17], [8, 25], [9, 24],
        [5, 28], [12, 21], [4, 29], [13, 20],
        [6, 27], [11, 22], [3, 30], [14, 19],
        [7, 26], [10, 23], [2, 31], [15, 18]
      ];

      pairings.forEach((pair, idx) => {
        let teamA = teams[pair[0] - 1];
        let seedA = pair[0];
        let teamB = teams[pair[1] - 1];
        let seedB = pair[1];

        // Check if seed B came from play-in
        const piMatch = playIns.find(p => p.seedA === seedB);
        if (piMatch) {
          teamB = bracketPicks[piMatch.id] || `Winner of ${piMatch.teamA}/${piMatch.teamB}`;
        }

        r128.push({
          id: `${quad}_r128_${idx}`,
          round: 'r128',
          teamA, seedA,
          teamB, seedB,
          nextMatchId: `${quad}_r64_${Math.floor(idx / 2)}`,
          slot: idx % 2 === 0 ? 'A' : 'B'
        });
      });

      // Round of 64 (8 matches)
      let r64 = [];
      for (let i = 0; i < 8; i++) {
        const m1 = r128[i * 2];
        const m2 = r128[i * 2 + 1];
        r64.push({
          id: `${quad}_r64_${i}`,
          round: 'r64',
          teamA: bracketPicks[m1.id] || `Winner Game ${i * 2 + 1}`,
          teamB: bracketPicks[m2.id] || `Winner Game ${i * 2 + 2}`,
          nextMatchId: `${quad}_s16_${Math.floor(i / 2)}`,
          slot: i % 2 === 0 ? 'A' : 'B'
        });
      }

      // Sweet 16 (4 matches)
      let s16 = [];
      for (let i = 0; i < 4; i++) {
        const m1 = r64[i * 2];
        const m2 = r64[i * 2 + 1];
        s16.push({
          id: `${quad}_s16_${i}`,
          round: 'sweet16',
          teamA: bracketPicks[m1.id] || `Winner R64 #${i * 2 + 1}`,
          teamB: bracketPicks[m2.id] || `Winner R64 #${i * 2 + 2}`,
          nextMatchId: `${quad}_e8_${Math.floor(i / 2)}`,
          slot: i % 2 === 0 ? 'A' : 'B'
        });
      }

      // Elite 8 (2 matches)
      let e8 = [];
      for (let i = 0; i < 2; i++) {
        const m1 = s16[i * 2];
        const m2 = s16[i * 2 + 1];
        e8.push({
          id: `${quad}_e8_${i}`,
          round: 'elite8',
          teamA: bracketPicks[m1.id] || `Winner S16 #${i * 2 + 1}`,
          teamB: bracketPicks[m2.id] || `Winner S16 #${i * 2 + 2}`,
          nextMatchId: `${quad}_rf_0`,
          slot: i === 0 ? 'A' : 'B'
        });
      }

      // Regional Final (1 match)
      const rf = [{
        id: `${quad}_rf_0`,
        round: 'regionfinal',
        teamA: bracketPicks[e8[0].id] || `Winner Elite 8 #1`,
        teamB: bracketPicks[e8[1].id] || `Winner Elite 8 #2`,
        nextMatchId: `final_semi_${quad === 'east' || quad === 'south' ? 0 : 1}`,
        slot: quad === 'east' || quad === 'midwest' ? 'A' : 'B'
      }];

      return { playin: playIns, r128, r64, sweet16: s16, elite8: e8, regionfinal: rf };
    }

    function renderScreen() {
      const container = document.getElementById('activeScreenContainer');
      if (currentQuadrant === 'finals') {
        renderFinals(container);
        return;
      }

      const matches = getQuadrantMatchups(currentQuadrant)[activeRound] || [];
      const regionName = currentQuadrant.toUpperCase();

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-gray-900 border border-gray-800 rounded-2xl p-6">
            <i class="ph ph-check-circle text-emerald-400 text-4xl mb-2"></i>
            <h3 class="font-bold text-white text-base">No Play-In Games Needed</h3>
            <p class="text-xs text-gray-400 mt-1">This quadrant has exactly 32 seeded programs.</p>
            <button onclick="setRound('r128')" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold">Jump to Round of 128</button>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="flex items-center justify-between pb-1 border-b border-gray-800">
          <div>
            <h2 class="text-sm font-extrabold uppercase text-blue-400 tracking-wider">${regionName} REGION</h2>
            <p class="text-[11px] text-gray-400">${activeRound.toUpperCase()} &bull; ${matches.length} Matchup${matches.length > 1 ? 's' : ''}</p>
          </div>
          <button onclick="advanceNextRoundPill()" class="text-xs font-semibold text-gray-400 hover:text-white flex items-center space-x-1">
            <span>Next Round</span>
            <i class="ph ph-caret-right"></i>
          </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          ${matches.map(m => renderMatchCard(m)).join('')}
        </div>
      `;
    }

    function renderMatchCard(m) {
      const winner = bracketPicks[m.id];
      const isPickA = winner && winner === m.teamA;
      const isPickB = winner && winner === m.teamB;
      const disabledA = !m.teamA || m.teamA.includes('Winner');
      const disabledB = !m.teamB || m.teamB.includes('Winner');

      return `
        <div class="bg-gray-900 border ${winner ? 'border-blue-500/40 shadow-blue-950/20 shadow-lg' : 'border-gray-800'} rounded-xl p-3 space-y-2">
          <!-- Team A -->
          <div onclick="${!disabledA ? `selectWinner('${m.id}', '${escapeQuotes(m.teamA)}')` : ''}" 
               class="card-team flex items-center justify-between p-2.5 rounded-lg border cursor-pointer ${
                 isPickA 
                   ? 'bg-blue-600/30 border-blue-500 text-white font-bold' 
                   : disabledA 
                     ? 'bg-gray-950/40 border-gray-800 text-gray-500 cursor-not-allowed' 
                     : 'bg-gray-950/80 border-gray-800 hover:border-gray-700 text-gray-300'
               }">
            <div class="flex items-center space-x-2 truncate">
              ${m.seedA ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${isPickA ? 'bg-blue-500 text-white' : 'bg-gray-800 text-gray-400'}">${m.seedA}</span>` : ''}
              <span class="text-xs truncate">${m.teamA}</span>
            </div>
            ${isPickA ? '<i class="ph ph-check-fat text-blue-400 text-sm"></i>' : ''}
          </div>

          <!-- Team B -->
          <div onclick="${!disabledB ? `selectWinner('${m.id}', '${escapeQuotes(m.teamB)}')` : ''}" 
               class="card-team flex items-center justify-between p-2.5 rounded-lg border cursor-pointer ${
                 isPickB 
                   ? 'bg-blue-600/30 border-blue-500 text-white font-bold' 
                   : disabledB 
                     ? 'bg-gray-950/40 border-gray-800 text-gray-500 cursor-not-allowed' 
                     : 'bg-gray-950/80 border-gray-800 hover:border-gray-700 text-gray-300'
               }">
            <div class="flex items-center space-x-2 truncate">
              ${m.seedB ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${isPickB ? 'bg-blue-500 text-white' : 'bg-gray-800 text-gray-400'}">${m.seedB}</span>` : ''}
              <span class="text-xs truncate">${m.teamB}</span>
            </div>
            ${isPickB ? '<i class="ph ph-check-fat text-blue-400 text-sm"></i>' : ''}
          </div>
        </div>
      `;
    }

    function renderFinals(container) {
      const eastWinner = bracketPicks['east_rf_0'] || 'East Champion';
      const southWinner = bracketPicks['south_rf_0'] || 'South Champion';
      const midwestWinner = bracketPicks['midwest_rf_0'] || 'Midwest Champion';
      const westWinner = bracketPicks['west_rf_0'] || 'West Champion';

      const semi1Pick = bracketPicks['semi_0'];
      const semi2Pick = bracketPicks['semi_1'];
      const nationalChampion = bracketPicks['champ_0'];

      container.innerHTML = `
        <div class="space-y-6">
          <div class="text-center py-2">
            <h2 class="text-lg font-black tracking-wider uppercase text-amber-400">National Championship Finals</h2>
            <p class="text-xs text-gray-400">The Final Four & National Title Game</p>
          </div>

          <!-- National Champion Hero Banner -->
          <div class="bg-gradient-to-b from-amber-500/20 to-gray-900 border-2 border-amber-500/40 rounded-2xl p-6 text-center shadow-2xl relative overflow-hidden">
            <i class="ph ph-crown text-amber-400 text-5xl mb-2 animate-bounce"></i>
            <span class="text-[11px] font-bold uppercase tracking-widest text-amber-400 block mb-1">National Champion</span>
            <h3 class="text-2xl font-black text-white tracking-wide">${nationalChampion || 'Undetermined'}</h3>
          </div>

          <!-- Semifinals -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Semifinal 1 (East vs South) -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-3.5 space-y-2">
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Semifinal 1 &bull; East vs South</span>
              <div onclick="${eastWinner !== 'East Champion' ? `selectWinner('semi_0', '${escapeQuotes(eastWinner)}')` : ''}" 
                   class="card-team p-2.5 rounded-lg border flex items-center justify-between cursor-pointer ${semi1Pick === eastWinner && eastWinner !== 'East Champion' ? 'bg-amber-500/20 border-amber-500 text-white font-bold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${eastWinner}</span>
                ${semi1Pick === eastWinner && eastWinner !== 'East Champion' ? '<i class="ph ph-check-fat text-amber-400"></i>' : ''}
              </div>
              <div onclick="${southWinner !== 'South Champion' ? `selectWinner('semi_0', '${escapeQuotes(southWinner)}')` : ''}" 
                   class="card-team p-2.5 rounded-lg border flex items-center justify-between cursor-pointer ${semi1Pick === southWinner && southWinner !== 'South Champion' ? 'bg-amber-500/20 border-amber-500 text-white font-bold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${southWinner}</span>
                ${semi1Pick === southWinner && southWinner !== 'South Champion' ? '<i class="ph ph-check-fat text-amber-400"></i>' : ''}
              </div>
            </div>

            <!-- Semifinal 2 (Midwest vs West) -->
            <div class="bg-gray-900 border border-gray-800 rounded-xl p-3.5 space-y-2">
              <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Semifinal 2 &bull; Midwest vs West</span>
              <div onclick="${midwestWinner !== 'Midwest Champion' ? `selectWinner('semi_1', '${escapeQuotes(midwestWinner)}')` : ''}" 
                   class="card-team p-2.5 rounded-lg border flex items-center justify-between cursor-pointer ${semi2Pick === midwestWinner && midwestWinner !== 'Midwest Champion' ? 'bg-amber-500/20 border-amber-500 text-white font-bold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${midwestWinner}</span>
                ${semi2Pick === midwestWinner && midwestWinner !== 'Midwest Champion' ? '<i class="ph ph-check-fat text-amber-400"></i>' : ''}
              </div>
              <div onclick="${westWinner !== 'West Champion' ? `selectWinner('semi_1', '${escapeQuotes(westWinner)}')` : ''}" 
                   class="card-team p-2.5 rounded-lg border flex items-center justify-between cursor-pointer ${semi2Pick === westWinner && westWinner !== 'West Champion' ? 'bg-amber-500/20 border-amber-500 text-white font-bold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${westWinner}</span>
                ${semi2Pick === westWinner && westWinner !== 'West Champion' ? '<i class="ph ph-check-fat text-amber-400"></i>' : ''}
              </div>
            </div>
          </div>

          <!-- Championship Matchup -->
          <div class="bg-gray-900 border border-amber-500/40 rounded-xl p-4 space-y-2">
            <span class="text-[11px] font-bold text-amber-400 uppercase tracking-widest block text-center">National Championship Game</span>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1">
              <div onclick="${semi1Pick ? `selectWinner('champ_0', '${escapeQuotes(semi1Pick)}')` : ''}" 
                   class="card-team p-3 rounded-lg border flex items-center justify-between cursor-pointer ${nationalChampion === semi1Pick && semi1Pick ? 'bg-amber-500/30 border-amber-400 text-white font-extrabold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${semi1Pick || 'Semifinal 1 Winner'}</span>
                ${nationalChampion === semi1Pick && semi1Pick ? '<i class="ph ph-trophy text-amber-400 text-base"></i>' : ''}
              </div>
              <div onclick="${semi2Pick ? `selectWinner('champ_0', '${escapeQuotes(semi2Pick)}')` : ''}" 
                   class="card-team p-3 rounded-lg border flex items-center justify-between cursor-pointer ${nationalChampion === semi2Pick && semi2Pick ? 'bg-amber-500/30 border-amber-400 text-white font-extrabold' : 'bg-gray-950 border-gray-800 text-gray-300'}">
                <span class="text-xs truncate">${semi2Pick || 'Semifinal 2 Winner'}</span>
                ${nationalChampion === semi2Pick && semi2Pick ? '<i class="ph ph-trophy text-amber-400 text-base"></i>' : ''}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectWinner(matchId, teamName) {
      bracketPicks[matchId] = teamName;
      saveState();
      renderScreen();
    }

    function advanceNextRoundPill() {
      const order = ['playin', 'r128', 'r64', 'sweet16', 'elite8', 'regionfinal'];
      const currentIndex = order.indexOf(activeRound);
      if (currentIndex < order.length - 1) {
        setRound(order[currentIndex + 1]);
      } else {
        switchQuadrant('finals');
      }
    }

    function updateProgress() {
      const totalGames = 137;
      let filled = Object.keys(bracketPicks).length;
      if (filled > totalGames) filled = totalGames;
      const pct = Math.round((filled / totalGames) * 100);
      document.getElementById('progressBar').style.width = `${pct}%`;
      document.getElementById('progressText').innerText = `${filled}/${totalGames}`;
    }

    function resetBracket() {
      if (confirm('Clear all your bracket selections? This will reset all picks.')) {
        bracketPicks = {};
        saveState();
        renderScreen();
      }
    }

    function randomizeAllPicks() {
      QUADRANTS.forEach(quad => {
        const matches = getQuadrantMatchups(quad);
        // Playin
        matches.playin.forEach(m => {
          const pick = Math.random() > 0.5 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
        // R128
        const r128Matches = getQuadrantMatchups(quad).r128;
        r128Matches.forEach(m => {
          const pick = Math.random() > 0.3 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
        // R64
        const r64Matches = getQuadrantMatchups(quad).r64;
        r64Matches.forEach(m => {
          const pick = Math.random() > 0.4 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
        // S16
        const s16Matches = getQuadrantMatchups(quad).sweet16;
        s16Matches.forEach(m => {
          const pick = Math.random() > 0.5 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
        // E8
        const e8Matches = getQuadrantMatchups(quad).elite8;
        e8Matches.forEach(m => {
          const pick = Math.random() > 0.5 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
        // Region Final
        const rfMatches = getQuadrantMatchups(quad).regionfinal;
        rfMatches.forEach(m => {
          const pick = Math.random() > 0.5 ? m.teamA : m.teamB;
          bracketPicks[m.id] = pick;
        });
      });

      // Semifinals
      const eastChamp = bracketPicks['east_rf_0'];
      const southChamp = bracketPicks['south_rf_0'];
      bracketPicks['semi_0'] = Math.random() > 0.5 ? eastChamp : southChamp;

      const midwestChamp = bracketPicks['midwest_rf_0'];
      const westChamp = bracketPicks['west_rf_0'];
      bracketPicks['semi_1'] = Math.random() > 0.5 ? midwestChamp : westChamp;

      // Final
      bracketPicks['champ_0'] = Math.random() > 0.5 ? bracketPicks['semi_0'] : bracketPicks['semi_1'];

      saveState();
      renderScreen();
    }

    // Seeding & Shuffling Functions
    function openSeedingModal() {
      const region = currentQuadrant === 'finals' ? 'east' : currentQuadrant;
      document.getElementById('modalRegionTitle').innerText = region;
      renderModalTeams(region);
      document.getElementById('seedModal').classList.remove('hidden');
    }

    function closeSeedingModal() {
      document.getElementById('seedModal').classList.add('hidden');
      renderScreen();
    }

    function renderModalTeams(region) {
      const list = document.getElementById('modalTeamsList');
      const teams = teamData[region];
      list.innerHTML = teams.map((team, idx) => `
        <div class="flex items-center space-x-2 bg-gray-950 p-2 rounded-lg border border-gray-800">
          <span class="text-xs font-mono text-gray-400 w-6 text-right">${idx + 1}.</span>
          <input type="text" value="${escapeQuotes(team)}" onchange="updateTeamName('${region}', ${idx}, this.value)" class="flex-1 bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-blue-500">
          <div class="flex space-x-1">
            <button onclick="moveTeam('${region}', ${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-30 p-1 text-gray-500"' : 'class="p-1 text-gray-400 hover:text-white"'}><i class="ph ph-arrow-up"></i></button>
            <button onclick="moveTeam('${region}', ${idx}, 1)" ${idx === teams.length - 1 ? 'disabled class="opacity-30 p-1 text-gray-500"' : 'class="p-1 text-gray-400 hover:text-white"'}><i class="ph ph-arrow-down"></i></button>
          </div>
        </div>
      `).join('');
    }

    function updateTeamName(region, index, newName) {
      teamData[region][index] = newName.trim();
      saveState();
    }

    function moveTeam(region, index, delta) {
      const target = index + delta;
      if (target < 0 || target >= teamData[region].length) return;
      const temp = teamData[region][index];
      teamData[region][index] = teamData[region][target];
      teamData[region][target] = temp;
      saveState();
      renderModalTeams(region);
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function shuffleCurrentQuadrant() {
      const region = currentQuadrant === 'finals' ? 'east' : currentQuadrant;
      teamData[region] = shuffleArray([...teamData[region]]);
      bracketPicks = {}; // clear downstream matches to avoid invalid states
      saveState();
      renderModalTeams(region);
    }

    function shuffleAllQuadrants() {
      QUADRANTS.forEach(quad => {
        teamData[quad] = shuffleArray([...teamData[quad]]);
      });
      bracketPicks = {};
      saveState();
      renderModalTeams(currentQuadrant === 'finals' ? 'east' : currentQuadrant);
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // PDF Generator via html2pdf
    function downloadBracketPDF() {
      const btn = document.getElementById('pdfBtn');
      btn.innerText = 'Generating...';
      btn.disabled = true;

      const exportDiv = document.getElementById('pdfExportContainer');
      exportDiv.classList.remove('hidden');

      const champ = bracketPicks['champ_0'] || 'Undetermined';
      const s1 = bracketPicks['semi_0'] || 'Undetermined';
      const s2 = bracketPicks['semi_1'] || 'Undetermined';

      exportDiv.innerHTML = `
        <div style="font-family: sans-serif; padding: 20px; color: #111;">
          <div style="text-align: center; border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 15px;">
            <h1 style="font-size: 20px; margin: 0; text-transform: uppercase;">FBS 138-Team College Football National Bracket</h1>
            <p style="font-size: 11px; color: #555; margin: 4px 0 0 0;">Official Bracket Results & Regional Seeding</p>
          </div>

          <div style="background: #f3f4f6; border: 2px solid #e5e7eb; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 20px;">
            <span style="font-size: 10px; text-transform: uppercase; color: #b45309; font-weight: bold; letter-spacing: 1px;">National Champion</span>
            <h2 style="font-size: 22px; margin: 5px 0; color: #000; font-weight: 900;">${champ}</h2>
            <div style="font-size: 11px; color: #4b5563; margin-top: 4px;">
              <strong>Finalists:</strong> ${s1} vs ${s2}
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            ${QUADRANTS.map(q => {
              const regChamp = bracketPicks[`${q}_rf_0`] || 'Undetermined';
              return `
                <div style="border: 1px solid #ccc; border-radius: 6px; padding: 10px; font-size: 10px;">
                  <h3 style="margin: 0 0 6px 0; text-transform: uppercase; font-size: 12px; color: #1d4ed8; border-bottom: 1px solid #eee; padding-bottom: 4px;">${q.toUpperCase()} REGION</h3>
                  <p style="margin: 0 0 8px 0; font-weight: bold;">Regional Champion: <span style="color: #000;">${regChamp}</span></p>
                  <div>
                    <strong>Top 8 Seeds:</strong>
                    <ol style="margin: 4px 0 0 16px; padding: 0;">
                      ${teamData[q].slice(0, 8).map((t, idx) => `<li>#${idx + 1} ${t}</li>`).join('')}
                    </ol>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      const opt = {
        margin: 0.4,
        filename: 'fbs_138_national_bracket.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(exportDiv).save().then(() => {
        exportDiv.classList.add('hidden');
        btn.innerHTML = '<i class="ph ph-file-pdf"></i><span>PDF</span>';
        btn.disabled = false;
      }).catch(err => {
        alert('PDF Generation failed: ' + err);
        exportDiv.classList.add('hidden');
        btn.innerHTML = '<i class="ph ph-file-pdf"></i><span>PDF</span>';
        btn.disabled = false;
      });
    }

    // Launch
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
